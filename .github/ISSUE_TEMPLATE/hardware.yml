name: Hardware compatibility report
description: 报告真实设备的兼容性或接收问题 / Report hardware results or receiver issues
title: "[Hardware] "
body:
  - type: markdown
    attributes:
      value: |
        感谢实机反馈。请分别说明“枚举成功”“能接收”“能收听”“搜台恢复”和“重启正常”，不要把模拟测试写成实机验证。
        此 issue 公开可见。请删除序列号、个人目录、收藏名称、令牌及网络设备地址；不要上传完整运行目录、录音或 IQ。
  - type: input
    id: revision
    attributes:
      label: 项目版本 / commit
      placeholder: Release tag or commit SHA
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: SDR 型号与连接方式 / Device model and connection
      description: 不要填写序列号。可注明 USB、直连/集线器及天线类型。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统、Python 版本与架构 / OS, Python version and architecture
      placeholder: Windows 11 x64, Python 3.13 x64
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: 接收后端 / Backend
      options:
        - rtl
        - soapy
        - demo (not a hardware test)
    validations:
      required: true
  - type: textarea
    id: drivers
    attributes:
      label: 驱动与库版本 / Driver and library versions
      description: 原生 RTL 库版本，或 SoapySDR、Python 绑定、设备模块及厂商库版本；注明来源。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 参数与复现步骤 / Parameters and reproduction steps
      description: 提供脱敏命令、频率、采样率、通道与可复现操作。增益/天线参数可选。
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: 实际结果与预期 / Actual and expected results
      description: 分别报告枚举、接收、调频、FM 收听、扫描/取消恢复、停止后能否由其他软件打开设备。未测试的项目写“未测试”。
    validations:
      required: true
  - type: input
    id: wallpaper
    attributes:
      label: Wallpaper Engine / 浏览器版本（若相关）
      description: 桌面问题请同时提供 Wallpaper Engine 版本、显卡与驱动版本，并说明浏览器控制台是否正常。
  - type: textarea
    id: logs
    attributes:
      label: 最小脱敏日志 / Minimal sanitized logs
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开前检查 / Before publishing
      options:
        - label: 我已删除序列号、个人路径、令牌、收藏名称及其他私人信息。
          required: true
        - label: 我已区分真实硬件结果与模拟测试，没有把未测试功能写成已验证。
          required: true
